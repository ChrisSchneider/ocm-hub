    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items: {$ref: "#/components/schemas/ErrorItem"}
    ErrorCode:
      type: string
      enum: [NAME_INVALID, REPOSITORY_INVALID, REPOSITORY_NOT_ALLOWED, PARAMETER_INVALID,
             COMPONENT_UNKNOWN, VERSION_UNKNOWN, RESOURCE_UNKNOWN, NOT_FOUND,
             METHOD_NOT_ALLOWED, NOT_ACCEPTABLE, RESOURCE_AMBIGUOUS, INTERNAL_ERROR,
             ACCESS_TYPE_UNSUPPORTED, NOT_IMPLEMENTED, UPSTREAM_ERROR, UPSTREAM_TIMEOUT,
             INDEX_UNAVAILABLE, NOT_COLLECTED, UNSUPPORTED_DOCUMENT, DOCUMENT_TOO_LARGE,
             DOCUMENT_CHANGED, DOCUMENT_NOT_ALLOWED, NOT_OCI]
      description: |
        `UNSUPPORTED_DOCUMENT` (422): not a recognised SBOM, VEX or scan (SARIF, CycloneDX) document.
        `DOCUMENT_TOO_LARGE` (422): over 32 MiB. `DOCUMENT_CHANGED` (409): a label
        link no longer serves the document the sync recorded (`detail.url`).
        `DOCUMENT_NOT_ALLOWED` (403): a label link's URL is not on the hub's
