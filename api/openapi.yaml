        descriptor: {$ref: "#/components/schemas/Descriptor"}
    DescriptorOrLocatedList:
      description: A descriptor, or with `recursive=-1` a list of located descriptors.
      oneOf:
        - $ref: "#/components/schemas/Descriptor"
        - {type: array, items: {$ref: "#/components/schemas/LocatedDescriptor"}}
    Selector:
      type: object
      properties:
        matchIdentity: {type: object, additionalProperties: {type: string}}
        matchLabels: {type: object, additionalProperties: {type: string}}
        expression: {type: string, description: CEL; reserved, not supported yet.}
    Extract:
      type: object
      description: Exactly one mode.
      properties:
        byComponents: {type: object, additionalProperties: {type: string}}
        byResources: {type: object, additionalProperties: {type: string}}
        expression: {type: string}
    DiscoveryRequest:
      type: object
      properties:
        componentSelector: {$ref: "#/components/schemas/Selector"}
        resourceSelector: {$ref: "#/components/schemas/Selector"}
        extract: {$ref: "#/components/schemas/Extract"}
    DiscoveryResult:
      type: object
      description: Exactly one of components or extracted.
      properties:
        components: {type: array, items: {$ref: "#/components/schemas/Descriptor"}}
        extracted: {type: array, items: {type: object, additionalProperties: true}}
    Descriptor:
      type: object
      description: OCM component descriptor, schema version v2 (see ocm.software).
      additionalProperties: true
