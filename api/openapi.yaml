        packages: {type: integer}
        statements: {type: integer}
        affected: {type: integer}
        findings: {type: integer}
        importantFindings: {type: integer}
        requirements: {type: integer, description: Requirements an assessment covers (its OSCAL findings).}
        notSatisfied: {type: integer, description: Requirements whose status is not satisfied.}
