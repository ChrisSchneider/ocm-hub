        type: {type: string, description: Raw predicate, artifact or media type.}
        source: {type: string, enum: [embedded, referrer, cosignTag, buildx, labelLink], description: Where the entry was found.}
        platform: {type: string}
        signed: {type: string, enum: [signed, component, no], description: What covers the document; nothing is verified.}
        digest: {type: string}
        resource: {$ref: "#/components/schemas/ResourceIdentity"}
        url: {type: string, description: Link from a label.}
        buildLevel: {type: integer, description: "SLSA build level a slsa entry claims (from a verification summary or a known builder); not verified."}
        builder: {type: string, description: SLSA provenance builder id.}
