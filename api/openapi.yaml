openapi: 3.1.0
info:
  title: OCM Component Server
  version: 0.1.0
  description: |
    Read access to OCM component versions. Discovery (listing, search, versions)
    is answered from an index that `cmd/sync` builds; descriptors and resources
    are read from OCM repositories at the location the index knows.

    All component routes live under `/v1/components/{name}`. `{name}` is an OCM
    component name and contains `/` (e.g. `ocm.software/ocmcli`). Clients send it
    percent-encoded (`ocm.software%2Focmcli`); the server also accepts it raw.
    Routing is right-anchored: fixed suffixes (`/versions`, `/descriptors/{version}`, `/overview/{version}`, `/supply-chain/{version}`,
    `/supply-chain/{version}/{digest}`, `/images/{version}/{resource}`,
    `/images/{version}/{resource}/{digest}`, `/resources/{version}/{resource}`) are matched from the right. Consequently the
    overview of a component whose name ends in `/versions` is not addressable by
    path (`/v1/components/a/versions` is the version list of `a`); use its
    versions/descriptors routes.

    `{version}` may be `latest` (the newest stable version by publish date); the
    server answers with `307` to the concrete version's URL.

    `?repository=` takes a location (`oci::host/path`, ocm CLI syntax) known to the
    index or a repository of a configured resolver.

    Without an index file the index-backed routes (and unpinned descriptor/resource
    routes) answer `503 INDEX_UNAVAILABLE`.
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Server is alive.
          content:
            text/plain:
              schema: {type: string}
  /v1/:
    get:
      operationId: getBase
      responses:
        "200":
          description: API version check (like OCI's `GET /v2/`).
          content:
            application/json:
              schema: {type: object}
  /v1/components:
    get:
      operationId: listComponents
      parameters:
        - {name: q, in: query, description: Case-insensitive substring of name or title., schema: {type: string}}
        - $ref: "#/components/parameters/LocationFilter"
        - $ref: "#/components/parameters/ConnectorFilter"
        - {name: provider, in: query, schema: {type: string}}
        - {name: category, in: query, description: Repeatable; all must match., style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: architecture, in: query, description: "Platform such as `linux/arm64`. Repeatable; all must match.", style: form, explode: true, schema: {type: array, items: {type: string}}}
        - $ref: "#/components/parameters/IncludePrerelease"
        - {name: updatedSince, in: query, description: RFC 3339; latest published at or after., schema: {type: string, format: date-time}}
        - {name: topLevel, in: query, description: "Only components without a parent of the same family (same provider and name prefix).", schema: {type: boolean, default: false}}
        - {name: replication, in: query, description: "`single`: components in one location; `replicated`: in two or more.", schema: {type: string, enum: [single, replicated]}}
        - {name: sort, in: query, description: "`relevance`: components included by many others and top-level components bundling many first, then most recently updated.", schema: {type: string, enum: [relevance, updated, name], default: relevance}}
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: A page of components with facets.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ComponentList"}
        "304": {$ref: "#/components/responses/NotModified"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headComponents
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/LocationFilter"
        - {name: provider, in: query, schema: {type: string}}
        - {name: category, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: architecture, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - $ref: "#/components/parameters/IncludePrerelease"
        - {name: updatedSince, in: query, schema: {type: string, format: date-time}}
        - {name: topLevel, in: query, description: "Only components without a parent of the same family (same provider and name prefix).", schema: {type: boolean, default: false}}
        - {name: replication, in: query, description: "`single`: components in one location; `replicated`: in two or more.", schema: {type: string, enum: [single, replicated]}}
        - {name: sort, in: query, description: "`relevance`: components included by many others and top-level components bundling many first, then most recently updated.", schema: {type: string, enum: [relevance, updated, name], default: relevance}}
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "304": {$ref: "#/components/responses/NotModified"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}:
    get:
      operationId: getComponent
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Component overview.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Component"}
        "304": {$ref: "#/components/responses/NotModified"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headComponent
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "304": {$ref: "#/components/responses/NotModified"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/versions:
    get:
      operationId: listVersions
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/IncludePrerelease"
        - {name: semverConstraint, in: query, description: "Masterminds syntax, e.g. `>=1.0.0, <2.0.0`; drops non-semver versions; filter only.", schema: {type: string}}
        - $ref: "#/components/parameters/LocationFilter"
        - $ref: "#/components/parameters/VersionsLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Versions, newest published first.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VersionList"}
        "304": {$ref: "#/components/responses/NotModified"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headVersions
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/IncludePrerelease"
        - {name: semverConstraint, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/LocationFilter"
        - $ref: "#/components/parameters/VersionsLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
        "304": {$ref: "#/components/responses/NotModified"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/descriptors/{version}:
    get:
      operationId: getDescriptor
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/Recursive"
        - $ref: "#/components/parameters/Compact"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Component descriptor (YAML by default, JSON via Accept); with recursive=-1 a list of located descriptors.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag:
              description: Strong ETag, the sha256 of the response body.
              schema: {type: string}
            Vary:
              description: Always `Accept` (the encoding depends on it).
              schema: {type: string}
          content:
            application/yaml:
              schema: {$ref: "#/components/schemas/DescriptorOrLocatedList"}
            application/json:
              schema: {$ref: "#/components/schemas/DescriptorOrLocatedList"}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headDescriptor
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/Recursive"
        - $ref: "#/components/parameters/Compact"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Descriptor exists (same headers as GET, no body).
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            Vary: {schema: {type: string}}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/overview/{version}:
    get:
      operationId: getVersionOverview
      description: |
        Overview of one component version, read live from OCM (labels, signed,
        contents). `latest` redirects (307) to the concrete version.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The overview.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag:
              description: Strong ETag, the sha256 of the response body.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ComponentVersionOverview"}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headVersionOverview
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag: {description: Strong ETag., schema: {type: string}}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/supply-chain/{version}:
    get:
      operationId: getSupplyChain
      description: |
        Supply chain documents (SBOM, SLSA, VEX, scans, ...) of one component version
        and its OCI resources, whatever their source (OCI attestations, embedded SBOM
        resources, label links), as gathered by a sync (index only, no OCM call). Each sync
        gathers each component's default version at its overview location; sets are
        kept per version and location and looked up exactly at `?repository=`, which
        a 200 therefore requires. Without it the route redirects (307) to the same
        version with `?repository=` set to the location the other version routes
        use; `latest` redirects (307) once to the concrete version, adding that
        location if absent. Nothing stored at the location answers `404
        NOT_COLLECTED` with `detail.collected` listing what exists. Nothing is
        verified.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The supply chain set.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag:
              description: Weak ETag of the index generation and the request.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupplyChain"}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headSupplyChain
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag: {description: Weak ETag., schema: {type: string}}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/supply-chain/{version}/{digest}:
    get:
      operationId: getSupplyChainDocument
      description: |
        One document of a stored supply chain set, found by its `digest`
        (index lookup, then read from the registry or, for a label link, fetched
        from the link, which must still hash to the digest the sync recorded).
        In-toto statements are unwrapped to their predicate. `?repository=` and
        `latest` behave as on `/supply-chain/{version}` (307). By default the bytes
        are sent as an attachment; `as=document` answers the parsed `Document`.
        A digest not in the set, an embedded SBOM (a resource) or an entry
        without content answer `404 NOT_FOUND`, with nothing fetched. A label
        link no longer on the allow list answers `403 DOCUMENT_NOT_ALLOWED`,
        with nothing fetched. Nothing is verified.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/DocumentDigest"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/As"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The stored document, or with `as=document` the parsed `Document`.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag:
              description: Strong ETag, the sha256 of the response body.
              schema: {type: string}
            Content-Disposition:
              description: "Without `as`: `attachment; filename=\"<first 12 hex of the digest>.json\"`."
              schema: {type: string}
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Document"
                  - description: The stored document bytes.
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headSupplyChainDocument
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/DocumentDigest"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/As"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag: {description: Strong ETag., schema: {type: string}}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/resources/{version}/{resource}:
    get:
      operationId: getResource
      description: |
        Streams the resource content. Extra identity attributes are passed as
        `extraIdentity.<key>=<value>` query parameters (e.g. `extraIdentity.arch=amd64`).
        `as=document` reads the resource (at most 32 MiB) and answers the parsed
        `Document` as `application/json` instead.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - name: resource
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/As"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Resource content, or with `as=document` the parsed `Document`.
          headers:
            OCM-Resource-Digest:
              description: |
                The resource digest from the OCM component descriptor (e.g. `sha256:<hex>`),
                when the descriptor carries one. For non-local access types (ociImage, helm,
                wget, …) this is OCM's digest of the artifact (possibly normalised), not a
                hash of the bytes served here.
              schema: {type: string}
            ETag:
              description: |
                Strong ETag; sent only when the served bytes are exactly the digested
                artifact (localBlob resources), then equal to `OCM-Resource-Digest`.
              schema: {type: string}
            Content-Disposition: {schema: {type: string}}
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
          content:
            "*/*":
              schema: {}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headResource
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - name: resource
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/As"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200": {description: Resource exists.}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/images/{version}/{resource}:
    get:
      operationId: getImageIndex
      description: |
        The platforms of the OCI image a resource names, read from its registry
        (the children of an index, skipping attestation manifests, or the platform
        of a single manifest). Extra identity attributes are passed as
        `extraIdentity.<key>=<value>` query parameters, like on `/resources`.
        `?repository=` and `latest` behave as there (`latest` answers 307). A
        resource that is not an OCI image answers `422 NOT_OCI`; a registry that
        cannot be read `502 UPSTREAM_ERROR`. Nothing is verified.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/ImageResource"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The image and its platforms.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag: {description: Strong ETag., schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImageIndex"}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headImageIndex
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/ImageResource"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag: {description: Strong ETag., schema: {type: string}}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {description: Error (no body on HEAD).}
  /v1/components/{name}/images/{version}/{resource}/{digest}:
    get:
      operationId: getImageDetails
      description: |
        One platform of an image: its manifest and config summarised. `digest` must
        be one of the platform digests of `/images/{version}/{resource}`, otherwise
        `404 NOT_FOUND`. With `raw=manifest` or `raw=config` the stored JSON is sent
        instead, with its own media type. Other behaviour as on the platforms route.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/ImageResource"
        - $ref: "#/components/parameters/ImageDigest"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/Raw"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The platform details, or with `raw` the manifest or config JSON.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag: {description: Strong ETag., schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImageDetails"}
            application/vnd.oci.image.manifest.v1+json:
              schema: {type: object, description: The stored manifest.}
            application/vnd.oci.image.config.v1+json:
              schema: {type: object, description: The stored image config.}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {$ref: "#/components/responses/Error"}
    head:
      operationId: headImageDetails
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/ImageResource"
        - $ref: "#/components/parameters/ImageDigest"
        - $ref: "#/components/parameters/Repository"
        - $ref: "#/components/parameters/Raw"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Same headers as GET, no body.
          headers:
            Cache-Control: {$ref: "#/components/headers/CacheControl"}
            ETag: {description: Strong ETag., schema: {type: string}}
        "304": {$ref: "#/components/responses/NotModified"}
        "307": {$ref: "#/components/responses/Redirect"}
        default: {description: Error (no body on HEAD).}
  /v1/discovery:
    post:
      operationId: discover
      description: >-
        Not implemented yet (always 501). Mirrors the `Discovery` resource of
        delivery.ocm.software/v1alpha1: selectors over components and resources,
        and either raw v2 descriptors or extracted records.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiscoveryRequest"}
      responses:
        "200":
          description: Discovery result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveryResult"}
        default: {$ref: "#/components/responses/Error"}
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      description: OCM component name; contains `/`, send percent-encoded.
      schema: {type: string}
    Version:
      name: version
      in: path
      required: true
      description: OCM version, or `latest`.
      schema: {type: string}
    Repository:
      name: repository
      in: query
      description: >-
        Pin a location (ocm CLI syntax, e.g. `oci::ghcr.io/acme`): one known to the
        index or a repository of a configured resolver.
      schema: {type: string}
    DocumentDigest:
      name: digest
      in: path
      required: true
      description: "Digest of a supply chain entry, as listed in its set (e.g. `sha256:<hex>`)."
      schema: {type: string}
    ImageResource:
      name: resource
      in: path
      required: true
      description: Resource name; add `extraIdentity.<key>=<value>` query parameters to pick one of several with the same name.
      schema: {type: string}
    ImageDigest:
      name: digest
      in: path
      required: true
      description: "Digest of a platform manifest, as listed by the platforms route (e.g. `sha256:<hex>`)."
      schema: {type: string}
    Raw:
      name: raw
      in: query
      description: "`manifest` or `config`: send the stored JSON instead of the summary."
      schema: {type: string, enum: [manifest, config]}
    As:
      name: as
      in: query
      description: "`document`: answer the parsed `Document` (SBOM, VEX and/or scan results) instead of the bytes."
      schema: {type: string, enum: [document]}
    Recursive:
      name: recursive
      in: query
      description: >-
        Like the ocm CLI's `--recursive`. `0` (default): this descriptor, as an object.
        `-1`: an array with this descriptor and, recursively, every referenced component
        version, each with the location it was read from: depth-first in
        `componentReferences` order (the CLI's order), each `name:version` once.
        Values above 0 are not implemented (400).
      schema: {type: integer, minimum: -1, default: 0}
    Compact:
      name: compact
      in: query
      description: >-
        `true`: trim each returned descriptor to what a component tree needs — `meta` and
        `component.name`, `version`, `provider`, `labels`, `componentReferences`; `resources`,
        `sources` and `repositoryContexts` are null, signatures omitted. The result is not a
        complete OCM descriptor. Combine with `recursive=-1` to load a whole tree cheaply.
      schema: {type: boolean, default: false}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string}
    ListLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    VersionsLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    Cursor:
      name: cursor
      in: query
      description: Opaque; the `next` of the previous page.
      schema: {type: string}
    IncludePrerelease:
      name: includePrerelease
      in: query
      description: Include pre-releases (alpha, beta, rc, … — see versions.prereleaseMarkers).
      schema: {type: boolean, default: false}
    LocationFilter:
      name: location
      in: query
      description: Repeatable; a location such as `oci::ghcr.io/open-component-model`.
      style: form
      explode: true
      schema: {type: array, items: {type: string}}
    ConnectorFilter:
      name: connector
      in: query
      description: "Repeatable; a source key (`github:enterprise:neonephos`) or an owner key (`github:org:open-component-model`). Several match any."
      style: form
      explode: true
      schema: {type: array, items: {type: string}}
  responses:
    NotModified:
      description: The representation matches If-None-Match (no body).
      headers:
        ETag: {$ref: "#/components/headers/ETag"}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
        Vary: {schema: {type: string}}
    Error:
      description: Error in the OCI error envelope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Redirect:
      description: "`latest` resolved to a concrete version."
      headers:
        Location: {schema: {type: string}}
        Cache-Control: {$ref: "#/components/headers/CacheControl"}
  headers:
    ETag:
      description: >-
        Validator; send it back in If-None-Match to get 304. Index routes send a weak
        ETag (`W/"<index generation>-<hash of the request>"`).
      schema: {type: string}
    CacheControl:
      description: "`no-cache` on successful responses (revalidate with the ETag), `no-store` on errors."
      schema: {type: string}
